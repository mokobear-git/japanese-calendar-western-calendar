<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>和暦西暦・CA計算</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@700&display=swap">
<style>
/* Layout: 単一カラムの計算カード。上部にタブ（①和暦⇄西暦 / ②期間）、結果は大きな数字で最上位に置く */
:root {
  --paper: #eef2f7;
  --surface: #ffffff;
  --ink: #18212f;
  --muted: #576274;
  --line: #cfd7e3;
  --accent: #24488a;
  --accent-ink: #ffffff;
  --accent-soft: #e1e9f6;
  --warn: #9a5200;
  --warn-soft: #fbefdf;
  --err: #b0241b;
  --err-soft: #fbe5e3;
  --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --font-num: "BIZ UDGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", ui-monospace, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e131b; --surface: #161e2b; --ink: #e5eaf2; --muted: #98a3b5; --line: #2a3546;
    --accent: #8eb0f5; --accent-ink: #0e131b; --accent-soft: #1d2a42;
    --warn: #f0b660; --warn-soft: #34270f; --err: #ff8f85; --err-soft: #3a1a18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e131b; --surface: #161e2b; --ink: #e5eaf2; --muted: #98a3b5; --line: #2a3546;
  --accent: #8eb0f5; --accent-ink: #0e131b; --accent-soft: #1d2a42;
  --warn: #f0b660; --warn-soft: #34270f; --err: #ff8f85; --err-soft: #3a1a18;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.6;
}
.wrap {
  max-width: 40rem;
  margin: 0 auto;
  padding-block: 1.25rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 1.25rem;
}
h1 { font-size: 1.35rem; margin: 0; text-wrap: balance; letter-spacing: .02em; }
h1 small { display: block; font-size: .8rem; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px;
}
.tabs a {
  display: block; text-align: center; text-decoration: none; color: var(--ink);
  padding: .7rem .5rem; border-radius: calc(var(--radius) - 4px); font-weight: 700; font-size: 1rem;
}
.tabs a[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tabs a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.panel { display: grid; gap: 1rem; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1rem; display: grid; gap: .75rem; min-width: 0;
}
.field { display: grid; gap: .45rem; min-width: 0; }
.field > label { font-weight: 700; font-size: .95rem; }
.field > label span { font-weight: 400; color: var(--muted); font-size: .85rem; }
.text-in {
  width: 100%; box-sizing: border-box; font: inherit; font-family: var(--font-num);
  font-size: 1.35rem; padding: .6rem .75rem; border: 2px solid var(--line); border-radius: 8px;
  background: var(--paper); color: var(--ink);
}
.text-in:focus { border-color: var(--accent); outline: none; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.cal {
  display: flex; align-items: center; gap: .4rem; font-size: .9rem; color: var(--muted);
  flex: 1 1 12rem; min-width: 0;
}
.cal input {
  flex: 1; min-width: 0; font: inherit; font-family: var(--font-num); font-size: 1rem; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .5rem;
}
button {
  font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: .5rem .85rem; min-height: 2.6rem;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.echo { font-size: .9rem; color: var(--muted); min-height: 1.4em; overflow-wrap: anywhere; }
.echo b { color: var(--ink); font-family: var(--font-num); }
.result { background: var(--accent-soft); border-color: transparent; }
.result .label { font-size: .8rem; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.big {
  font-family: var(--font-num); font-size: 2.6rem; line-height: 1.15; font-weight: 700;
  font-variant-numeric: tabular-nums; letter-spacing: .01em; overflow-wrap: anywhere; color: var(--ink);
}
.big.dim { color: var(--muted); font-size: 1.6rem; }
.big.jp { font-family: var(--font-body); font-size: 2.1rem; letter-spacing: 0; }
.sub { font-size: 1.05rem; overflow-wrap: anywhere; }
.sub .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .5rem 1rem; margin: 0; }
.stats div { min-width: 0; }
.stats dt { font-size: .8rem; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--font-num); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.msg { font-size: .92rem; padding: .5rem .7rem; border-radius: 8px; }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.err { background: var(--err-soft); color: var(--err); }
.hint { font-size: .85rem; color: var(--muted); margin: 0; }
.hint code { font-family: var(--font-num); background: var(--paper); padding: 0 .3em; border-radius: 4px; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .8rem; color: var(--muted); font-weight: 700; }
td.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.wcal {
  border: 1px solid var(--line); border-radius: 8px; padding: .6rem; display: grid; gap: .5rem;
  background: var(--surface); min-width: 0;
}
.wcal-sel { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: .35rem; }
.wcal select {
  font: inherit; font-size: 1rem; font-weight: 700; padding: .45rem .3rem; min-width: 0;
  border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
}
.wcal-nav { display: grid; grid-template-columns: auto 1fr auto; gap: .35rem; align-items: center; }
.wcal-nav button { min-height: 2.4rem; min-width: 3.2rem; padding: .2rem .5rem; font-size: 1.2rem; }
.wcal-west { text-align: center; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-family: var(--font-num); }
.wcal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.wcal-grid .dow { text-align: center; font-size: .78rem; color: var(--muted); font-weight: 700; }
.wcal-grid button {
  min-height: 2.5rem; padding: 0; font-family: var(--font-num); font-weight: 400; font-size: 1rem;
  border: 2px solid transparent; background: var(--paper); border-radius: 6px;
}
.wcal-grid .sun { color: var(--err); }
.wcal-grid .sat { color: var(--accent); }
.wcal-grid button.today { border-color: var(--accent); }
.wcal-grid button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.wcal-grid .era-mark { display: block; font-size: .6rem; line-height: 1; font-family: var(--font-body); }
.wcal-foot { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; }
details summary { cursor: pointer; font-weight: 700; }
.toast { font-size: .85rem; color: var(--muted); }

/* スマホ：文字を大きく */
@media (max-width: 640px) {
  html { font-size: 20px; }
  h1 { font-size: 1.25rem; }
  .text-in { font-size: 1.5rem; padding: .7rem .8rem; }
  .cal input { font-size: 1.05rem; padding: .55rem .5rem; }
  .big { font-size: 2.5rem; }
  .big.jp { font-size: 1.65rem; }
  button { min-height: 2.8rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .tabs a, button { transition: background-color .15s, color .15s; }
}
</style>
</head>
<body>
<main class="wrap">
  <h1>和暦西暦・CA計算<small>大正・昭和・平成・令和（T/S/H/R）対応</small></h1>

  <nav class="tabs" role="tablist" aria-label="機能">
    <a href="#wareki" id="tab-wareki" role="tab" aria-controls="panel-wareki">① 和暦⇄西暦</a>
    <a href="#ca" id="tab-ca" role="tab" aria-controls="panel-ca">② 期間</a>
  </nav>

  <!-- ① 和暦⇄西暦 -->
  <section class="panel" id="panel-wareki" role="tabpanel" aria-labelledby="tab-wareki">
    <div class="card result" aria-live="polite">
      <div class="label" id="w-label">西暦</div>
      <div class="big" id="w-out">—</div>
      <div class="sub" id="w-sub"></div>
      <div class="row">
        <button type="button" class="primary" id="w-copy">西暦をコピー</button>
        <span class="toast" id="w-toast" role="status"></span>
      </div>
    </div>
    <div class="card">
      <div class="field">
        <label for="w-in">日付を入力 <span>和暦・西暦どちらでも可</span></label>
        <input class="text-in" id="w-in" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="">
        <div class="row">
          <label class="cal" for="w-cal">西暦カレンダー <input id="w-cal" type="date" min="1868-01-01" max="2200-12-31"></label>
          <button type="button" data-wcal="w" aria-expanded="false" aria-controls="w-wcal">和暦カレンダー</button>
          <button type="button" data-clear="w">クリア</button>
        </div>
        <div class="wcal" id="w-wcal" hidden></div>
      </div>
      <div id="w-msg"></div>
      <p class="hint">和暦を入れると西暦、西暦を入れると和暦を表示。年月のみ（日なし）も可。</p>
      <p class="hint" id="w-hint-w">和暦→西暦：</p>
      <p class="hint" id="w-hint-s">西暦→和暦：</p>
    </div>
  </section>

  <!-- ② 期間 -->
  <section class="panel" id="panel-ca" role="tabpanel" aria-labelledby="tab-ca" hidden>
    <div class="card result" aria-live="polite">
      <div class="label">2つの日付の間の年月</div>
      <div class="big" id="c-out">—</div>
      <div class="sub" id="c-sub"></div>
      <dl class="stats" id="c-stats" hidden>
        <div><dt>総月数</dt><dd id="c-months"></dd></div>
        <div><dt>総日数</dt><dd id="c-days"></dd></div>
      </dl>
      <div class="row">
        <button type="button" class="primary" id="c-copy">CAをコピー</button>
        <span class="toast" id="c-toast" role="status"></span>
      </div>
    </div>
    <div class="card">
      <div class="field">
        <label for="a-in">日付A <span>生年月日など</span></label>
        <input class="text-in" id="a-in" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="">
        <div class="row">
          <label class="cal" for="a-cal">西暦カレンダー <input id="a-cal" type="date" min="1868-01-01" max="2200-12-31"></label>
          <button type="button" data-wcal="a" aria-expanded="false" aria-controls="a-wcal">和暦カレンダー</button>
          <button type="button" data-clear="a">クリア</button>
        </div>
        <div class="wcal" id="a-wcal" hidden></div>
        <div class="echo" id="a-echo"></div>
      </div>
      <div class="field">
        <label for="b-in">日付B <span>検査日・基準日など</span></label>
        <input class="text-in" id="b-in" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="">
        <div class="row">
          <label class="cal" for="b-cal">西暦カレンダー <input id="b-cal" type="date" min="1868-01-01" max="2200-12-31"></label>
          <button type="button" data-wcal="b" aria-expanded="false" aria-controls="b-wcal">和暦カレンダー</button>
          <button type="button" id="b-today">今日</button>
          <button type="button" data-clear="b">クリア</button>
        </div>
        <div class="wcal" id="b-wcal" hidden></div>
        <div class="echo" id="b-echo"></div>
      </div>
      <div id="c-msg"></div>
      <p class="hint">A・Bの順序は問わない（新しい方から古い方を引く）。表記は <code>CA年-月</code>。日付Bの「日」が日付Aの「日」に達していない月は数えない。年月のみ（日なし）の入力は月単位で計算。</p>
    </div>
  </section>

  <details class="card">
    <summary>元号早見表</summary>
    <div class="table-scroll">
      <table>
        <thead><tr><th>元号</th><th>略号</th><th>開始日（西暦）</th><th>西暦＝元号年＋</th></tr></thead>
        <tbody id="era-table"></tbody>
      </table>
    </div>
    <p class="hint">明治5年以前は旧暦（太陰太陽暦）のため、本換算は明治6年（1873年）以降を前提とする。</p>
  </details>
</main>

<script>
(function (root) {
  'use strict';

  // 新しい順。start は改元日（グレゴリオ暦）
  var ERAS = [
    { name: '令和', abbr: 'R', start: [2019, 5, 1] },
    { name: '平成', abbr: 'H', start: [1989, 1, 8] },
    { name: '昭和', abbr: 'S', start: [1926, 12, 25] },
    { name: '大正', abbr: 'T', start: [1912, 7, 30] },
    { name: '明治', abbr: 'M', start: [1868, 10, 23] }
  ];
  var WEEK = '日月火水木金土';

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function dayNum(y, m, d) {
    var t = new Date(0); t.setUTCFullYear(y, m - 1, d); t.setUTCHours(0, 0, 0, 0);
    return Math.round(t.getTime() / 86400000);
  }
  function key(y, m, d) { return y * 10000 + m * 100 + d; }
  function eraStartKey(e) { return key(e.start[0], e.start[1], e.start[2]); }

  function normalize(s) {
    return String(s == null ? '' : s)
      .replace(/[！-～]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[\s　]/g, '')
      .replace(/[‐-―−ー]/g, '-')
      .replace(/[・。]/g, '.')
      .replace(/[,.、\-\/]+$/, '');
  }

  function findEra(token) {
    var t = token.toUpperCase();
    for (var i = 0; i < ERAS.length; i++) if (ERAS[i].name === token || ERAS[i].abbr === t) return ERAS[i];
    return null;
  }

  function eraOf(y, m, d) {
    var k = key(y, m, d);
    for (var i = 0; i < ERAS.length; i++) if (k >= eraStartKey(ERAS[i])) return ERAS[i];
    return null;
  }
  function eraYearText(e, y) { var ey = y - e.start[0] + 1; return ey === 1 ? '元' : String(ey); }

  // d を省略すると年月のみの表記
  function toWareki(y, m, d) {
    if (d == null) {
      var e1 = eraOf(y, m, 1), e2 = eraOf(y, m, dim(y, m));
      if (!e2) return null;
      var t2 = e2.name + eraYearText(e2, y) + '年' + m + '月';
      var s2 = e2.abbr + (y - e2.start[0] + 1) + '.' + m;
      if (!e1 || e1 === e2) return { era: e2, text: t2, short: s2 };
      var t1 = e1.name + eraYearText(e1, y) + '年' + m + '月';
      return {
        era: e2, short: e1.abbr + (y - e1.start[0] + 1) + '.' + m + '／' + s2,
        text: t1 + '（' + e2.start[2] + '日から' + t2 + '）'
      };
    }
    var e = eraOf(y, m, d);
    if (!e) return null;
    return {
      era: e,
      text: e.name + eraYearText(e, y) + '年' + m + '月' + d + '日',
      short: e.abbr + (y - e.start[0] + 1) + '.' + m + '.' + d
    };
  }

  // 戻り値: {ok, y, m, d|null, partial, warn?} | {ok:false, error} | {ok:false, empty:true}
  function parseDate(input) {
    var s = normalize(input);
    if (!s) return { ok: false, empty: true };
    var era = null, rest = s;
    var em = s.match(/^(令和|平成|昭和|大正|明治|[RHSTMrhstm])(.*)$/);
    if (em) { era = findEra(em[1]); rest = em[2]; }
    rest = rest.replace(/^元(?=[年\/.\-])/, '1');

    var y, mo, d = null, mm;
    if ((mm = rest.match(/^(\d{1,4})[年\/.\-](\d{1,2})[月\/.\-](\d{1,2})日?$/))) {
      y = +mm[1]; mo = +mm[2]; d = +mm[3];
    } else if ((mm = rest.match(/^(\d{1,4})[年\/.\-](\d{1,2})月?$/))) {
      y = +mm[1]; mo = +mm[2];
    } else if (/^\d+$/.test(rest)) {
      var n = rest.length;
      if (era) {
        if (n === 6) { y = +rest.slice(0, 2); mo = +rest.slice(2, 4); d = +rest.slice(4, 6); }
        else if (n === 5) { y = +rest.slice(0, 1); mo = +rest.slice(1, 3); d = +rest.slice(3, 5); }
        else if (n === 4) { y = +rest.slice(0, 2); mo = +rest.slice(2, 4); }
        else if (n === 3) { y = +rest.slice(0, 1); mo = +rest.slice(1, 3); }
        else return { ok: false, error: '元号付きの数字のみ表記は 年2桁＋月2桁（＋日2桁）で入力' };
      } else {
        if (n === 8) { y = +rest.slice(0, 4); mo = +rest.slice(4, 6); d = +rest.slice(6, 8); }
        else if (n === 6) { y = +rest.slice(0, 4); mo = +rest.slice(4, 6); }
        else return { ok: false, error: '数字のみの西暦は8桁（年月日）または6桁（年月）で入力' };
      }
    } else {
      return { ok: false, error: '日付として読み取れない。例: H8/3/21、平成8年3月21日、19960321、平成8年3月' };
    }

    if (era) {
      if (y < 1) return { ok: false, error: '元号の年は1（元年）以上' };
      y = era.start[0] - 1 + y;
    } else if (y < 1000) {
      return { ok: false, error: '西暦は4桁、和暦は元号（T/S/H/R など）を付けて入力' };
    }
    if (mo < 1 || mo > 12) return { ok: false, error: '月は1〜12' };
    if (d != null && (d < 1 || d > dim(y, mo))) return { ok: false, error: y + '年' + mo + '月は' + dim(y, mo) + '日まで' };

    var res = { ok: true, y: y, m: mo, d: d, partial: d == null, fromEra: !!era };
    if (era) {
      var idx = ERAS.indexOf(era), newer = idx > 0 ? ERAS[idx - 1] : null;
      var lo = key(y, mo, d == null ? dim(y, mo) : d), hi = key(y, mo, d == null ? 1 : d);
      var w = toWareki(y, mo, d);
      if (lo < eraStartKey(era)) {
        res.warn = era.name + 'は' + era.start[0] + '年' + era.start[1] + '月' + era.start[2] + '日から。この日付は' + (w ? w.text : '明治以前') + 'に当たる';
      } else if (newer && hi >= eraStartKey(newer)) {
        res.warn = era.name + 'は' + newer.name + 'への改元前日まで。この日付は' + w.text + 'に当たる';
      }
    }
    if (y < 1873) res.warn = (res.warn ? res.warn + '。' : '') + '明治5年以前は旧暦のため、実際の暦日と異なる';
    return res;
  }

  // 年月のみの入力が含まれる場合は月単位（日数なし）
  function diff(a, b) {
    var swapped = false;
    if (key(a.y, a.m, a.d || 0) > key(b.y, b.m, b.d || 0)) { var t = a; a = b; b = t; swapped = true; }
    var partial = a.d == null || b.d == null;
    var months = (b.y - a.y) * 12 + (b.m - a.m);
    var r = { swapped: swapped, partial: partial };
    if (!partial) {
      if (b.d < a.d) months--;
      var idx = a.m - 1 + months;
      var ay = a.y + Math.floor(idx / 12), am = idx % 12 + 1, ad = Math.min(a.d, dim(ay, am));
      r.days = dayNum(b.y, b.m, b.d) - dayNum(ay, am, ad);
      r.totalDays = dayNum(b.y, b.m, b.d) - dayNum(a.y, a.m, a.d);

    return r;
  }

  function fmt(p) { return p.y + '/' + pad(p.m) + (p.d == null ? '' : '/' + pad(p.d)); }
  function iso(p) { return p.d == null ? '' : String(p.y).padStart(4, '0') + '-' + pad(p.m) + '-' + pad(p.d); }
  function weekday(p) {
    if (p.d == null) return '';
    var t = new Date(0); t.setUTCFullYear(p.y, p.m - 1, p.d); return WEEK[t.getUTCDay()];
  }

  // 入力例用のランダムな日付（昭和改元〜平成末）
  function randomDate(rnd) {
    rnd = rnd || Math.random;
    var lo = dayNum(1926, 12, 25), hi = dayNum(2019, 4, 30);
    var t = new Date((lo + Math.floor(rnd() * (hi - lo + 1))) * 86400000);
    return { ok: true, y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), partial: false };
  }
  // 同じ日付をいくつかの書き方で
  function examples(p) {
    var e = eraOf(p.y, p.m, p.d), ey = p.y - e.start[0] + 1;
    return [
      e.abbr + ey + '/' + p.m + '/' + p.d,
      e.name + eraYearText(e, p.y) + '年' + p.m + '月' + p.d + '日',
      e.abbr + ey + '.' + p.m + '.' + p.d,

  var api = { ERAS: ERAS, normalize: normalize, parseDate: parseDate, toWareki: toWareki, diff: diff, fmt: fmt, iso: iso, weekday: weekday, randomDate: randomDate, examples: examples };

(function () {
  'use strict';
  if (typeof document === 'undefined') return;
  var W = window.WarekiCA;
  var $ = function (id) { return document.getElementById(id); };

  function describe(p) {
    var w = W.toWareki(p.y, p.m, p.d);
    return { western: W.fmt(p), wareki: w ? w.text : '', short: w ? w.short : '', wd: W.weekday(p) };
  }
  function setMsg(el, kind, text) {
    el.innerHTML = '';
    if (!text) return;
    var div = document.createElement('div');
    div.className = 'msg ' + kind; div.textContent = text; el.appendChild(div);
  }

  // 入力欄とカレンダーの同期
  function bind(prefix, onChange) {
    var txt = $(prefix + '-in'), cal = $(prefix + '-cal');
    function fromText() {
      var p = W.parseDate(txt.value);
      cal.value = p.ok ? W.iso(p) : '';
      onChange();
    }
    txt.addEventListener('input', fromText);
    cal.addEventListener('change', function () {
      if (cal.value) {
        var a = cal.value.split('-');
        txt.value = (+a[0]) + '/' + a[1] + '/' + a[2];
      }
      onChange();
    });
    var clr = document.querySelector('[data-clear="' + prefix + '"]');
    clr.addEventListener('click', function () { txt.value = ''; cal.value = ''; onChange(); txt.focus(); });
    warekiCal(prefix, txt);
    fromText();
  }

  // 和暦カレンダー（元号・年・月を選んで日を押す）
  var ERAS = W.ERAS, WEEK = '日月火水木金土';
  function k3(y, m, d) { return y * 10000 + m * 100 + d; }
  function dimOf(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function eraOf(y, m, d) {
    var k = k3(y, m, d);
    for (var i = 0; i < ERAS.length; i++) if (k >= k3.apply(null, ERAS[i].start)) return ERAS[i];
    return null;
  }
  function eraEnd(e) { // 次の元号の改元前日
    var i = ERAS.indexOf(e);
    if (i === 0) return [2100, 12, 31];
    var s = ERAS[i - 1].start, t = new Date(Date.UTC(s[0], s[1] - 1, s[2] - 1));
    return [t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()];
  }
  function overlaps(e, y, m) {
    var st = e.start, en = eraEnd(e);
    return k3(y, m, dimOf(y, m)) >= k3(st[0], st[1], st[2]) && k3(y, m, 1) <= k3(en[0], en[1], en[2]);
  }
  function opt(sel, value, label) {
    var o = document.createElement('option'); o.value = value; o.textContent = label; sel.appendChild(o);
  }

  function warekiCal(prefix, txt) {
    var box = $(prefix + '-wcal'), btn = document.querySelector('[data-wcal="' + prefix + '"]');
    var v = { era: null, y: 0, m: 0 }, sel = null;
    box.innerHTML =
      '<div class="wcal-sel">' +
      '<select id="' + prefix + '-wc-era" aria-label="元号"></select>' +
      '<select id="' + prefix + '-wc-year" aria-label="年"></select>' +
      '<select id="' + prefix + '-wc-month" aria-label="月"></select></div>' +
      '<div class="wcal-nav"><button type="button" data-nav="-1" aria-label="前の月">‹</button>' +
      '<div class="wcal-west" aria-live="polite"></div>' +
      '<button type="button" data-nav="1" aria-label="次の月">›</button></div>' +
      '<div class="wcal-grid"></div>' +
      '<div class="wcal-foot"><button type="button" data-act="today">今日</button>' +
      '<button type="button" data-act="close">閉じる</button></div>';
    var sEra = $(prefix + '-wc-era'), sYear = $(prefix + '-wc-year'), sMonth = $(prefix + '-wc-month');
    var west = box.querySelector('.wcal-west'), grid = box.querySelector('.wcal-grid');
    ERAS.forEach(function (e, i) { opt(sEra, i, e.name); });
    for (var m = 1; m <= 12; m++) opt(sMonth, m, m + '月');

    function clamp() {
      var e = v.era, st = e.start, en = eraEnd(e);
      if (k3(v.y, v.m, dimOf(v.y, v.m)) < k3(st[0], st[1], st[2])) { v.y = st[0]; v.m = st[1]; }
      if (k3(v.y, v.m, 1) > k3(en[0], en[1], en[2])) { v.y = en[0]; v.m = en[1]; }
    }
    function render() {
      var e = v.era, maxY = eraEnd(e)[0] - e.start[0] + 1, ey = v.y - e.start[0] + 1;
      sEra.value = ERAS.indexOf(e);
      sYear.innerHTML = '';
      for (var i = 1; i <= maxY; i++) opt(sYear, i, (i === 1 ? '元' : i) + '年');
      sYear.value = ey; sMonth.value = v.m;
      west.textContent = '西暦' + v.y + '年' + v.m + '月';
      box.querySelector('[data-nav="-1"]').disabled = k3(v.y, v.m, 1) <= k3(1868, 10, 1);
      box.querySelector('[data-nav="1"]').disabled = k3(v.y, v.m, 1) >= k3(2100, 12, 1);
      grid.innerHTML = '';
      for (var w = 0; w < 7; w++) {
        var h = document.createElement('div'); h.className = 'dow' + (w === 0 ? ' sun' : w === 6 ? ' sat' : '');
        h.textContent = WEEK[w]; grid.appendChild(h);
      }
      var first = new Date(Date.UTC(v.y, v.m - 1, 1)).getUTCDay();
      for (var b = 0; b < first; b++) grid.appendChild(document.createElement('span'));
      var now = new Date(), tk = k3(now.getFullYear(), now.getMonth() + 1, now.getDate());
      for (var d = 1; d <= dimOf(v.y, v.m); d++) {
        var dw = (first + d - 1) % 7, de = eraOf(v.y, v.m, d);
        var c = document.createElement('button');
        c.type = 'button'; c.dataset.day = d; c.textContent = d;
        c.className = (dw === 0 ? 'sun' : dw === 6 ? 'sat' : '') + (k3(v.y, v.m, d) === tk ? ' today' : '');
        c.setAttribute('aria-pressed', String(!!sel && sel === k3(v.y, v.m, d)));
        var label = (de ? de.name + (v.y - de.start[0] + 1 === 1 ? '元' : v.y - de.start[0] + 1) + '年' : '') + v.m + '月' + d + '日（' + WEEK[dw] + '）';
        c.setAttribute('aria-label', label);
        if (de && v.y === de.start[0] && v.m === de.start[1] && d === de.start[2]) {
          var mk = document.createElement('span'); mk.className = 'era-mark'; mk.textContent = de.name; c.appendChild(mk);
        }
        grid.appendChild(c);
      }
    }
    function setYM(y, m, keepEra) {
      v.y = y; v.m = m;
      if (!keepEra || !overlaps(v.era, y, m)) v.era = eraOf(y, m, dimOf(y, m)) || ERAS[ERAS.length - 1];
      clamp(); render();
    }
    function open() {
      var p = W.parseDate(txt.value), now = new Date();
      if (p.ok) {
        sel = p.d == null ? null : k3(p.y, p.m, p.d);
        v.era = eraOf(p.y, p.m, p.d || 1) || ERAS[ERAS.length - 1];
        setYM(p.y, p.m, true);
      } else {
        sel = null; v.era = null; setYM(now.getFullYear(), now.getMonth() + 1, false);
      }
      box.hidden = false; btn.setAttribute('aria-expanded', 'true');
    }
    function close() { box.hidden = true; btn.setAttribute('aria-expanded', 'false'); }

    btn.addEventListener('click', function () { box.hidden ? open() : close(); });
    sEra.addEventListener('change', function () {
      var e = ERAS[+sEra.value], ey = v.y - v.era.start[0] + 1;
      v.era = e;
      var maxY = eraEnd(e)[0] - e.start[0] + 1;
      v.y = e.start[0] - 1 + Math.min(Math.max(ey, 1), maxY);
      clamp(); render();
    });
    sYear.addEventListener('change', function () { v.y = v.era.start[0] - 1 + (+sYear.value); clamp(); render(); });
    sMonth.addEventListener('change', function () { v.m = +sMonth.value; clamp(); render(); });
    box.addEventListener('click', function (ev) {
      var t = ev.target.closest('button');
      if (!t || !box.contains(t)) return;
      if (t.dataset.nav) {
        var idx = v.y * 12 + (v.m - 1) + (+t.dataset.nav);
        setYM(Math.floor(idx / 12), idx % 12 + 1, true);
      } else if (t.dataset.act === 'today') {
        var n = new Date(); v.era = null; setYM(n.getFullYear(), n.getMonth() + 1, false);
      } else if (t.dataset.act === 'close') {
        close(); btn.focus();
      } else if (t.dataset.day) {
        var d = +t.dataset.day, e = eraOf(v.y, v.m, d);
        if (!e) return;
        txt.value = e.abbr + (v.y - e.start[0] + 1) + '/' + v.m + '/' + d;
        txt.dispatchEvent(new Event('input'));
        close();
      }
    });
  }

  // ① 和暦⇄西暦
  function renderW() {
    var p = W.parseDate($('w-in').value), out = $('w-out'), sub = $('w-sub'), msg = $('w-msg');
    if (p.ok) {
      var d = describe(p), wd = d.wd ? '（' + d.wd + '）' : '';
      if (p.fromEra) {
        // 和暦 → 西暦
        $('w-label').textContent = '西暦'; $('w-copy').textContent = '西暦をコピー';
        out.textContent = d.western; out.className = 'big';
        sub.textContent = d.wareki + wd + '　' + d.short;
        setMsg(msg, 'warn', p.warn || '');
      } else if (d.wareki) {
        // 西暦 → 和暦
        $('w-label').textContent = '和暦'; $('w-copy').textContent = '和暦をコピー';
        out.textContent = d.wareki; out.className = 'big jp';
        sub.textContent = d.short + '　' + d.western + wd;
        setMsg(msg, 'warn', p.warn || '');
      } else {
        $('w-label').textContent = '和暦';
        out.textContent = '—'; out.className = 'big dim'; sub.textContent = d.western + wd;
        setMsg(msg, 'err', '明治改元（1868年10月23日）より前は和暦に変換できない');
      }
    } else {
      out.textContent = '—'; out.className = 'big dim'; sub.textContent = '';
      setMsg(msg, 'err', p.empty ? '' : p.error);
    }
  }

  // ② 期間
  function echo(el, p) {
    el.innerHTML = '';
    if (!p.ok) return;
    var d = describe(p), extra = [d.wareki, d.wd].filter(Boolean).join('・');
    el.appendChild(document.createTextNode('→ '));
    var b = document.createElement('b'); b.textContent = d.western; el.appendChild(b);
    if (extra) el.appendChild(document.createTextNode('（' + extra + '）'));
  }
  function renderC() {
    var a = W.parseDate($('a-in').value), b = W.parseDate($('b-in').value);
    echo($('a-echo'), a); echo($('b-echo'), b);
    var out = $('c-out'), sub = $('c-sub'), stats = $('c-stats'), msg = $('c-msg');
    var errs = [];
    if (!a.ok && !a.empty) errs.push('日付A：' + a.error);
    if (!b.ok && !b.empty) errs.push('日付B：' + b.error);
    var warns = [];
    if (a.ok && a.warn) warns.push('日付A：' + a.warn);
    if (b.ok && b.warn) warns.push('日付B：' + b.warn);
    if (a.ok && b.ok) {
      var r = W.diff(a, b);
      out.textContent = 'CA' + r.years + '-' + r.months; out.className = 'big';
      sub.innerHTML = '';
      var n = document.createElement('span'); n.className = 'num';
      n.textContent = r.years + '歳' + r.months + 'か月' + (r.partial ? '' : r.days + '日');
      sub.appendChild(n);
      $('c-months').textContent = r.totalMonths.toLocaleString('ja-JP') + 'か月';
      $('c-days').textContent = r.partial ? '—' : r.totalDays.toLocaleString('ja-JP') + '日';
      stats.hidden = false;
      if (r.partial) warns.push('年月のみの入力を含むため、月単位で計算（日は考慮しない）');
      if (r.swapped) warns.push('日付Aが日付Bより新しいため、入れ替えて計算');
    } else {
      out.textContent = '—'; out.className = 'big dim'; sub.textContent = '2つの日付を入力'; stats.hidden = true;
    }
    if (errs.length) setMsg(msg, 'err', errs.join(' / '));
    else setMsg(msg, 'warn', warns.join(' / '));
  }

  function copy(btn, toast, getText) {
    btn.addEventListener('click', function () {
      var text = getText();
      if (!text || text === '—') { toast.textContent = 'コピーする結果がない'; return; }
      var done = function () { toast.textContent = 'コピーした：' + text; };
      var fallback = function () {
        var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
        var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        toast.textContent = ok ? 'コピーした：' + text : '自動コピー不可。結果を長押しして選択';
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
        else fallback();
      } catch (e) { fallback(); }
    });
  }

  function today() {
    var t = new Date();
    return t.getFullYear() + '/' + (t.getMonth() + 1) + '/' + t.getDate();
  }

  // 入力例：開くたびにランダムな日付
  var exW = W.examples(W.randomDate()), exA = W.examples(W.randomDate());
  $('w-in').value = exW[0];
  $('w-in').placeholder = '例: ' + exW[0];
  $('a-in').value = exA[0];
  $('a-in').placeholder = '例: ' + exA[1];
  $('b-in').value = today();
  $('b-in').placeholder = '例: ' + today();
  function addCodes(el, list) {
    list.forEach(function (s) {
      el.appendChild(document.createTextNode(' '));
      var c = document.createElement('code'); c.textContent = s; el.appendChild(c);
    });
  }
  var rs = W.randomDate();
  addCodes($('w-hint-w'), exW);
  addCodes($('w-hint-s'), [rs.y + '/' + rs.m + '/' + rs.d, String(rs.y) + (rs.m < 10 ? '0' : '') + rs.m + (rs.d < 10 ? '0' : '') + rs.d,
    rs.y + '年' + rs.m + '月' + rs.d + '日', rs.y + '/' + rs.m]);

  bind('w', renderW);
  bind('a', renderC);
  bind('b', renderC);
  $('b-today').addEventListener('click', function () {
    $('b-in').value = today(); $('b-in').dispatchEvent(new Event('input'));
  });
  copy($('w-copy'), $('w-toast'), function () { return $('w-out').textContent; });
  copy($('c-copy'), $('c-toast'), function () { return $('c-out').textContent; });

  // 元号早見表
  var tb = $('era-table');
  W.ERAS.forEach(function (e) {
    var tr = document.createElement('tr');
    [e.name, e.abbr, e.start[0] + '/' + e.start[1] + '/' + e.start[2], String(e.start[0] - 1)].forEach(function (v, i) {
      var td = document.createElement('td'); td.textContent = v; if (i >= 2) td.className = 'num'; tr.appendChild(td);
    });
    tb.appendChild(tr);
  });

  // タブ（#wareki / #ca）
  function route() {
    var tab = location.hash === '#ca' ? 'ca' : 'wareki';
    ['wareki', 'ca'].forEach(function (t) {
      $('panel-' + t).hidden = t !== tab;
      $('tab-' + t).setAttribute('aria-selected', String(t === tab));
    });
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
